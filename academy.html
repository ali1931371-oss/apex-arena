<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101010"><meta name="description" content="آکادمی آزاد آموزش مافیای صوتی APEX ARENA"><title>آکادمی آموزش | APEX ARENA</title><style>*{box-sizing:border-box}body{margin:0;background:#101010;color:#f5f0df;font-family:Tahoma,Arial,sans-serif;text-align:center}header{padding:16px 18px;border-bottom:1px solid #80652e;background:#161616;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}h1{color:#d8b45a;letter-spacing:2px;font-size:25px;margin:0}h2{font-size:23px;color:#e4c46e}p{color:#d0c8b5;line-height:2}.page-intro{padding:35px 15px;background:radial-gradient(ellipse at 50% 0%,#493714 0%,#211a0d 35%,#101010 76%)}.page-wrap{max-width:1000px;margin:20px auto;padding:22px}.page-card{border:1px solid #80652e;border-radius:12px;padding:18px;margin:15px 0;text-align:right;background:#202020}.page-card h3{color:#e4c46e}.tournament-rules{white-space:pre-wrap;border-right:3px solid #80652e;padding:9px 12px;background:#191919;border-radius:7px;color:#e4d7b8;line-height:2}.academy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.academy-card{border:1px solid #80652e;border-radius:12px;padding:15px;text-align:right;background:#202020;overflow:hidden}.academy-card h3{color:#e4c46e}.academy-card img{width:100%;max-height:240px;object-fit:cover;border-radius:8px;margin-bottom:10px}.academy-card p{overflow-wrap:anywhere}.post-summary{color:#e4c46e}.post-date{color:#a99b79;font-size:12px}.post-body{white-space:pre-wrap;text-align:right;line-height:2.2;overflow-wrap:anywhere;color:#e5dece}.post-video{width:100%;aspect-ratio:16/9;border:0;border-radius:8px;margin:12px 0}.status{color:#d8b45a}.error{color:#ff8c8c!important}.empty{color:#aaa}.page-link{display:inline-block;padding:10px 16px;border:1px solid #80652e;border-radius:8px;color:#e4c46e;text-decoration:none}footer{padding:25px;color:#a99b79;font-size:13px}@media(max-width:600px){header{display:block}header .page-link{margin-top:12px}.page-wrap{padding:12px}}</style></head><body>
<header><h1>APEX ARENA</h1><a class="page-link" href="index.html">بازگشت به صفحه اصلی</a></header>
<section class="page-intro"><h2>آکادمی آموزش APEX ARENA</h2><p>دانش، تجربه و مهارت؛ مسیر تبدیل شدن به یک بازیکن حرفه‌ای.</p><p>مطالب این آکادمی برای همه بازدیدکنندگان آزاد است و برای مشاهده آموزش‌ها نیازی به ثبت‌نام یا ورود نیست.</p></section>
<main class="page-wrap"><p id="academy-status" class="status">در حال دریافت مطالب آکادمی...</p><div id="academy-list" class="academy-grid"></div></main><footer>© APEX ARENA — All Rights Reserved</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
"use strict";
const SUPABASE_URL="https://vzythswxlvubytzmvhep.supabase.co",SUPABASE_KEY="sb_publishable_aKHWCQLdnGFMB5_SADJT5Q_h7-8eK69",BUCKET_NAME="apex-education";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function makeElement(tag,className,text){const el=document.createElement(tag);if(className)el.className=className;if(text!==undefined&&text!==null)el.textContent=text;return el;}
function getYouTubeEmbedUrl(input){if(!input)return null;try{const url=new URL(input.trim()),host=url.hostname.replace(/^www\\./,"");let id="";if(host==="youtu.be")id=url.pathname.split("/").filter(Boolean)[0]||"";else if(["youtube.com","m.youtube.com","youtube-nocookie.com"].includes(host)){if(url.pathname==="/watch")id=url.searchParams.get("v")||"";else if(url.pathname.startsWith("/embed/")||url.pathname.startsWith("/shorts/"))id=url.pathname.split("/")[2]||"";}else return null;return /^[a-zA-Z0-9_-]{11}$/.test(id)?"https://www.youtube-nocookie.com/embed/"+id:null;}catch(e){return null;}}
async function loadAcademyPosts(){
 const status=document.getElementById("academy-status"),list=document.getElementById("academy-list");list.replaceChildren();
 try{
  const {data,error}=await supabaseClient.from("educational_posts").select("id,title,slug,summary,body,content_type,image_path,video_url,published_at,created_at").eq("is_published",true).order("published_at",{ascending:false});
  if(error)throw error;if(!data||!data.length){status.textContent="هنوز مطلبی در آکادمی منتشر نشده است.";return;}status.textContent="مطالب منتشرشده آکادمی";
  data.forEach(post=>{const card=makeElement("article","academy-card");
   if(post.image_path){const {data:imageData}=supabaseClient.storage.from(BUCKET_NAME).getPublicUrl(post.image_path);if(imageData&&imageData.publicUrl){const img=makeElement("img");img.src=imageData.publicUrl;img.alt=post.title||"تصویر آکادمی";img.loading="lazy";card.appendChild(img);}}
   card.appendChild(makeElement("h3","",post.title));if(post.summary)card.appendChild(makeElement("p","post-summary",post.summary));
   const video=getYouTubeEmbedUrl(post.video_url);if(video){const iframe=makeElement("iframe","post-video");iframe.src=video;iframe.title=post.title||"ویدئوی آموزشی";iframe.loading="lazy";iframe.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";iframe.allowFullscreen=true;card.appendChild(iframe);}
   if(post.body)card.appendChild(makeElement("p","post-body",post.body));if(post.published_at)card.appendChild(makeElement("p","post-date","تاریخ انتشار: "+new Date(post.published_at).toLocaleDateString("fa-IR")));list.appendChild(card);
  });
 }catch(error){status.textContent="دریافت مطالب آکادمی با مشکل مواجه شد.";status.classList.add("error");console.error("Academy public loading error:",error);}
}
loadAcademyPosts();
</script></body></html>
