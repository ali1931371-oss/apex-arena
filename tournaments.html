<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426">
<meta name="description" content="فهرست عمومی مسابقات و تورنمنت‌های APEX ARENA"><title>مشاهده مسابقات | APEX ARENA</title>
<style>
:root{color-scheme:dark;--bg:#050b14;--panel:#0b1728;--panel2:#10233a;--blue:#168bff;--cyan:#55c8ff;--gold:#d8b45a;--text:#f2f6ff;--muted:#a9bad0;--line:rgba(75,160,230,.3)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -15%,#12345a 0%,#081629 36%,var(--bg) 76%);color:var(--text);font-family:Tahoma,Arial,sans-serif;text-align:center;min-height:100vh}
header{padding:16px 20px;border-bottom:1px solid var(--line);background:rgba(4,11,21,.94);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
.brand{font-size:23px;font-weight:900;letter-spacing:2px;color:#d8eaff;text-shadow:0 0 18px rgba(22,139,255,.4)}
h2{font-size:clamp(22px,4vw,30px);color:#eaf5ff;margin:0 0 12px}
p{color:var(--muted);line-height:2}
.page-intro{position:relative;overflow:hidden;padding:52px 16px 44px;background:linear-gradient(135deg,rgba(8,27,49,.92),rgba(5,12,23,.82)),repeating-linear-gradient(135deg,transparent 0 22px,rgba(68,161,235,.035) 22px 24px);border-bottom:1px solid var(--line)}
.page-intro:before,.page-intro:after{content:"";position:absolute;width:230px;height:230px;border:1px solid rgba(70,166,255,.13);transform:rotate(45deg);pointer-events:none}
.page-intro:before{top:-150px;right:7%}.page-intro:after{bottom:-175px;left:8%}
.eyebrow{display:inline-block;padding:7px 15px;border:1px solid rgba(85,200,255,.35);border-radius:99px;color:var(--cyan);font-size:11px;letter-spacing:2px;margin-bottom:16px;background:rgba(10,39,67,.55)}
.page-intro p{max-width:650px;margin:0 auto}
.page-wrap{max-width:1120px;margin:28px auto;padding:0 20px 45px}
#connection-status{margin:0 auto 20px;padding:10px 15px;max-width:500px;border:1px solid var(--line);border-radius:10px;background:rgba(9,24,42,.8);font-size:13px}
.status{color:#8bd7ff}.error{color:#ff9292!important}.empty{padding:38px 16px;border:1px dashed rgba(85,200,255,.3);border-radius:16px;background:rgba(10,25,43,.65)}
#tournament-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:20px;text-align:right}
.tournament-card{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;min-height:100%;padding:0;border:1px solid rgba(65,155,226,.34);border-radius:17px;background:linear-gradient(155deg,rgba(17,42,68,.98),rgba(6,15,28,.98) 65%);box-shadow:0 14px 35px rgba(0,0,0,.28);transition:transform .25s,border-color .25s,box-shadow .25s}
.tournament-card:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(120deg,transparent 15%,rgba(38,145,235,.10),transparent 68%);opacity:.8}
.tournament-card:after{content:"";position:absolute;top:-60px;left:-55px;width:155px;height:155px;border:1px solid rgba(91,187,255,.14);transform:rotate(45deg);z-index:-1}
.tournament-card:hover{transform:translateY(-5px);border-color:rgba(85,200,255,.75);box-shadow:0 18px 42px rgba(0,80,150,.2)}
.card-top{padding:19px 20px 15px;border-bottom:1px solid rgba(75,160,230,.18);background:linear-gradient(90deg,rgba(14,51,85,.55),rgba(7,18,32,.15))}
.card-kicker{font-size:10px;color:var(--cyan);letter-spacing:2px;margin-bottom:8px;font-weight:bold}
.tournament-card h3{margin:0;color:#f1f7ff;font-size:19px;line-height:1.8}
.card-content{padding:16px 20px 20px;display:flex;flex-direction:column;gap:12px;flex:1}
.description{margin:0;color:#bdcce0;font-size:13px;line-height:2.1;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:3px 0}
.stat{padding:10px 7px;border:1px solid rgba(85,160,220,.2);border-radius:10px;background:rgba(4,13,25,.58);text-align:center}
.stat strong{display:block;color:#eaf6ff;font-size:18px;margin-bottom:4px;font-variant-numeric:tabular-nums}
.stat span{display:block;color:#8faac5;font-size:10px;line-height:1.7}
.rules-title{font-size:13px;color:#75caff;margin:2px 0 -5px}
.tournament-rules{white-space:pre-wrap;border-right:3px solid var(--blue);padding:10px 12px;background:rgba(3,12,23,.72);border-radius:8px;color:#d6e5f5;line-height:2;font-size:12px;max-height:180px;overflow:auto}
.page-link{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border:1px solid rgba(85,200,255,.45);border-radius:9px;color:#e8f6ff;text-decoration:none;background:linear-gradient(135deg,#1264a8,#0a3157);font-size:13px;font-weight:bold;transition:.2s;margin-top:auto}
.page-link:hover{background:linear-gradient(135deg,#168bff,#0b477c);border-color:#80d7ff}
footer{padding:25px;color:#7890aa;font-size:12px;border-top:1px solid rgba(75,160,230,.16)}
@media(max-width:600px){header{justify-content:center}.page-wrap{padding:0 13px 30px}.page-intro{padding:40px 16px}.stats{gap:6px}.stat{padding:9px 4px}.stat strong{font-size:16px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body>
<header><div class="brand">APEX ARENA</div><a class="page-link" href="index.html">بازگشت به صفحه اصلی</a></header>
<section class="page-intro"><div class="eyebrow">THE ARENA • OFFICIAL TOURNAMENTS</div><h2>فهرست مسابقات APEX ARENA</h2><p>رقابت‌ها را بررسی کنید، ظرفیت باقی‌مانده را ببینید و وارد میدان شوید.</p></section>
<main class="page-wrap"><p id="connection-status" class="status" role="status" aria-live="polite">در حال دریافت اطلاعات تورنمنت‌ها...</p><div id="tournament-list"></div></main>
<footer>© APEX ARENA — All Rights Reserved</footer>
<script>
"use strict";
const SUPABASE_URL="https://vzythswxlvubytzmvhep.supabase.co";
const SUPABASE_KEY="sb_publishable_aKHWCQLdnGFMB5_SADJT5Q_h7-8eK69";
function makeElement(tag,className,text){const el=document.createElement(tag);if(className)el.className=className;if(text!==undefined&&text!==null)el.textContent=text;return el;}
async function loadTournaments(){
 const status=document.getElementById("connection-status"),list=document.getElementById("tournament-list");
 try{
  const response=await fetch(SUPABASE_URL+"/rest/v1/rpc/get_open_tournaments",{method:"POST",headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"},body:"{}"});
  if(!response.ok)throw new Error("خطا در دریافت اطلاعات: "+response.status);
  const tournaments=await response.json(),rulesByTournament=new Map();
  if(Array.isArray(tournaments)&&tournaments.length){
   const ids=tournaments.map(t=>t.tournament_id).filter(Boolean);
   if(ids.length){const params=new URLSearchParams({select:"tournament_id,rules_text",tournament_id:"in.("+ids.join(",")+")"});
    const rulesResponse=await fetch(SUPABASE_URL+"/rest/v1/tournament_public_rules?"+params.toString(),{headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}});
    if(rulesResponse.ok){const rows=await rulesResponse.json();(rows||[]).forEach(row=>rulesByTournament.set(row.tournament_id,row.rules_text||""));}
    else console.warn("قوانین تورنمنت‌ها فعلاً دریافت نشدند:",rulesResponse.status);
   }
  }
  status.textContent="فهرست مسابقات به‌روز شد.";
  if(!Array.isArray(tournaments)||!tournaments.length){list.replaceChildren(makeElement("p","empty","در حال حاضر تورنمنتی برای ثبت‌نام وجود ندارد."));return;}
  list.replaceChildren();
  tournaments.forEach(t=>{
   const card=makeElement("article","tournament-card"),top=makeElement("div","card-top"),content=makeElement("div","card-content");
   top.append(makeElement("div","card-kicker","APEX ARENA • TOURNAMENT"),makeElement("h3","",t.tournament_name||"تورنمنت بدون نام"));
   content.appendChild(makeElement("p","description",t.tournament_description||"توضیحاتی برای این رقابت ثبت نشده است."));
   const stats=makeElement("div","stats");
   [[t.max_players,"ظرفیت کل"],[t.approved_players,"بازیکن تأییدشده"],[t.available_slots,"ظرفیت باقی‌مانده"]].forEach(([value,label])=>{const item=makeElement("div","stat");item.append(makeElement("strong","",value===null||value===undefined?"—":String(value)),makeElement("span","",label));stats.appendChild(item);});
   content.appendChild(stats);
   const rules=rulesByTournament.get(t.tournament_id);
   if(rules&&rules.trim())content.append(makeElement("h4","rules-title","قوانین تورنمنت"),makeElement("p","tournament-rules",rules));
   const link=makeElement("a","page-link","مشاهده فهرست اعضا");link.href="tournament-members.html?id="+encodeURIComponent(t.tournament_id);content.appendChild(link);
   card.append(top,content);list.appendChild(card);
  });
 }catch(error){status.textContent="دریافت اطلاعات با مشکل مواجه شد. لطفاً بعداً تلاش کنید.";status.classList.add("error");console.error(error);}
}
loadTournaments();
</script></body></html>
