<style>
*{box-sizing:border-box}

<body><main>
<header class="results-hero"><img class="results-poster" src="assets/player-champions-bg.jpg" alt="یادگاری ویژه برای نفرات برتر؛ جام و مدال‌های قهرمانی"><div class="results-heading"><h1>APEX ARENA | نتایج رسمی بازیکنان</h1><div class="muted">نتایج بازیکنان پس از تأیید ارزیابی‌های داوران توسط مدیریت، برای عموم منتشر می‌شوند.</div><a href="index.html">بازگشت به سایت</a></div></header>
<section class="panel"><h2>انتخاب تورنمنت</h2><label for="tournamentSelect">انتخاب تورنمنت برای مشاهده نتایج بازیکنان</label><select id="tournamentSelect"><option value="">در حال دریافت...</option></select><p id="pageStatus" class="status" role="status">در حال دریافت فهرست نتایج...</p></section>
<section id="results" class="hidden"><div id="resultList"></div></section>
</main>
<script src="/_vendor/supabase-js.js"></script>
<script>
"use strict";
const SUPABASE_URL=window.location.origin + "/_supabase";
const SUPABASE_KEY="sb_publishable_aKHWCQLdnGFMB5_SADJT5Q_h7-8eK69";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
function el(tag,text,cls){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function status(message,error=false){$("pageStatus").textContent=message;$("pageStatus").className="status "+(error?"error":message?"success":"")}
async function rpc(name,args={}){const {data,error}=await db.rpc(name,args);if(error)throw error;return data}
async function loadTournaments(){
 try{
  const rows=await rpc("get_public_judge_result_tournaments");
  const select=$("tournamentSelect");select.replaceChildren();
  const placeholder=el("option",rows?.length?"یک تورنمنت را انتخاب کنید":"هنوز نتیجه تأییدشده‌ای منتشر نشده است");placeholder.value="";select.append(placeholder);
  (rows||[]).forEach(t=>{const o=el("option",t.tournament_name);o.value=t.tournament_id;select.append(o)});
  if(rows?.length){select.value=rows[0].tournament_id;await loadResults()}
  else status("پس از تأیید نخستین ارزیابی توسط مدیر، نتایج اینجا نمایش داده می‌شوند.");
 }catch(e){status("دریافت فهرست تورنمنت‌ها ناموفق بود: "+e.message,true)}
}
function renderResults(rows){
 const box=$("resultList");box.replaceChildren();
 if(!rows?.length){box.append(el("p","برای این تورنمنت هنوز نتیجه تأییدشده‌ای منتشر نشده است.","muted"));return}
 rows.forEach(r=>{
  const card=el("article",undefined,"result"),head=el("div",undefined,"result-head");
  head.append(el("h3",(r.display_name||"بازیکن")+" — "+r.stage_name+" | بازی "+r.game_number));
  card.append(head);
  card.append(el("p",(r.player_code?"کد بازیکن: "+r.player_code+" | ":"")+r.side+" | نقش: "+r.role_name+" | تعداد داوران تأییدکننده: "+r.judge_count,"muted"));
  const totals=el("div",undefined,"grid");
  [["فنی",r.technical_total],["تشویقی",r.bonus_total],["جریمه",r.penalty_total],["نهایی",r.final_total]].forEach(([label,value])=>{
   const m=el("div",undefined,"metric");m.append(el("span",label),el("strong",Number(value||0).toFixed(2)));totals.append(m);
  });
  card.append(totals);
  const reviewLink=el("a","مشاهده جزئیات نمرات و ثبت اعتراض","review-link");reviewLink.href="player-score-review.html";card.append(reviewLink);
  box.append(card);
 });
}
async function loadResults(){
 const tid=$("tournamentSelect").value;if(!tid){$("results").classList.add("hidden");return}
 status("در حال دریافت نتایج تأییدشده...");
 try{const rows=await rpc("get_public_judge_game_results",{p_tournament_id:tid});renderResults(rows||[]);$("results").classList.remove("hidden");status((rows||[]).length+" نتیجه تأییدشده دریافت شد.")}
 catch(e){$("results").classList.add("hidden");status("دریافت نتایج ناموفق بود: "+e.message,true)}
}
$("tournamentSelect").addEventListener("change",loadResults);
loadTournaments();
</script></body></html>
