<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101010">
<title>نتایج بازیکنان | APEX ARENA</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--gold:#ffd76a;--gold2:#f4b936;--gold3:#fff0b5;--line:rgba(255,211,99,.34)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,rgba(255,195,65,.2),transparent 42%),linear-gradient(145deg,#100d07 0%,#211707 48%,#0d0b07 100%);color:#fff8e8;font-family:Tahoma,Arial,sans-serif;line-height:1.9;position:relative;overflow-x:hidden}
body:before{content:"🏆";position:fixed;z-index:0;pointer-events:none;left:50%;top:48%;transform:translate(-50%,-50%);font-size:min(58vw,520px);line-height:1;opacity:.055;filter:drop-shadow(0 0 35px rgba(255,190,45,.5))}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(115deg,transparent 0 90px,rgba(255,220,130,.018) 91px 92px,transparent 93px 180px)}
main{position:relative;z-index:1;max-width:1120px;margin:auto;padding:22px 14px 64px}
header,.panel,.result{background:linear-gradient(145deg,rgba(47,36,17,.96),rgba(24,19,10,.96));border:1px solid var(--line);border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 12px 34px rgba(0,0,0,.32),inset 0 1px rgba(255,239,184,.08)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-color:rgba(255,215,106,.55);background:linear-gradient(110deg,rgba(71,49,12,.97),rgba(28,22,11,.97) 58%,rgba(67,45,10,.96))}
h1,h2,h3,h4{color:var(--gold3);margin-top:0;text-shadow:0 2px 14px rgba(255,190,45,.18)}
h1{font-size:clamp(20px,4vw,28px);margin-bottom:5px}h2{font-size:20px}h3{font-size:17px;margin-bottom:4px}h4{font-size:15px;margin:15px 0 6px}
p{color:#e3d6b8}a{color:#ffe39a;text-decoration:none;border-bottom:1px solid rgba(255,227,154,.35)}a:hover{color:#fff}
label{display:block;color:var(--gold);margin:10px 0 5px}
select{width:100%;padding:13px;border:1px solid rgba(255,211,99,.55);border-radius:11px;background:#171208;color:#fff8e8;font:inherit;outline:none}
select:focus{border-color:var(--gold3);box-shadow:0 0 0 3px rgba(255,215,106,.13)}
.muted{color:#c7b994;font-size:13px}.status{white-space:pre-wrap;overflow-wrap:anywhere;padding:9px 12px;border-radius:10px;background:rgba(255,214,106,.06)}.error{color:#ffaaa0}.success{color:#ffe39a}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.metric{background:linear-gradient(145deg,rgba(255,215,106,.1),rgba(15,12,7,.78));border:1px solid rgba(255,211,99,.3);border-radius:13px;padding:12px;text-align:center}
.metric strong{display:block;color:var(--gold3);font-size:23px;text-shadow:0 0 16px rgba(255,197,66,.2)}
.result{position:relative;overflow:hidden;border-color:rgba(255,211,99,.3);background:linear-gradient(135deg,rgba(48,36,15,.97),rgba(22,18,11,.98))}
.result:after{content:"🏅";position:absolute;left:14px;top:12px;font-size:44px;opacity:.10;pointer-events:none}
.result-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.chip{display:inline-block;border:1px solid rgba(255,220,130,.7);background:linear-gradient(135deg,rgba(255,219,125,.2),rgba(255,183,35,.08));color:#ffe7a5;border-radius:30px;padding:4px 12px;font-size:13px;font-weight:bold}
.criteria{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 10px;border-bottom:1px solid rgba(255,211,99,.13);color:#eee1c4}
.criteria:last-child{border:0}.criteria strong{color:var(--gold3)}
.hidden{display:none!important}
@media(max-width:560px){main{padding:12px 10px 40px}header{display:block;text-align:center}header a{display:inline-block;margin-top:8px}.panel,.result,header{padding:15px}.result:after{font-size:34px}}
</style></head>
<body><main>
<header><div><h1>APEX ARENA | نتایج رسمی بازیکنان</h1><div class="muted">نتایج بازیکنان پس از تأیید ارزیابی‌های داوران توسط مدیریت، برای عموم منتشر می‌شوند.</div></div><a href="index.html">بازگشت به سایت</a></header>
<section class="panel"><h2>انتخاب تورنمنت</h2><label for="tournamentSelect">انتخاب تورنمنت برای مشاهده نتایج بازیکنان</label><select id="tournamentSelect"><option value="">در حال دریافت...</option></select><p id="pageStatus" class="status" role="status">در حال دریافت فهرست نتایج...</p></section>
<section id="results" class="hidden"><div id="resultList"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const SUPABASE_URL="https://vzythswxlvubytzmvhep.supabase.co";
const SUPABASE_KEY="sb_publishable_aKHWCQLdnGFMB5_SADJT5Q_h7-8eK69";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
function el(tag,text,cls){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function status(message,error=false){$("pageStatus").textContent=message;$("pageStatus").className="status "+(error?"error":message?"success":"")}
async function rpc(name,args={}){const {data,error}=await db.rpc(name,args);if(error)throw error;return data}
async function loadTournaments(){
 try{
  const rows=await rpc("get_public_judge_result_tournaments");
  const select=$("tournamentSelect");select.replaceChildren();
  const placeholder=el("option",rows?.length?"یک تورنمنت را انتخاب کنید":"هنوز نتیجه تأییدشده‌ای منتشر نشده است");placeholder.value="";select.append(placeholder);
  (rows||[]).forEach(t=>{const o=el("option",t.tournament_name);o.value=t.tournament_id;select.append(o)});
  if(rows?.length){select.value=rows[0].tournament_id;await loadResults()}
  else status("پس از تأیید نخستین ارزیابی توسط مدیر، نتایج اینجا نمایش داده می‌شوند.");
 }catch(e){status("دریافت فهرست تورنمنت‌ها ناموفق بود: "+e.message,true)}
}
function renderResults(rows){
 const box=$("resultList");box.replaceChildren();
 if(!rows?.length){box.append(el("p","برای این تورنمنت هنوز نتیجه تأییدشده‌ای منتشر نشده است.","muted"));return}
 rows.forEach(r=>{
  const card=el("article",undefined,"result"),head=el("div",undefined,"result-head");
  head.append(el("h3",(r.display_name||"بازیکن")+" — "+r.stage_name+" | بازی "+r.game_number));
  head.append(el("span",r.final_total+" امتیاز نهایی","chip"));card.append(head);
  card.append(el("p",(r.player_code?"کد بازیکن: "+r.player_code+" | ":"")+r.side+" | نقش: "+r.role_name+" | تعداد داوران تأییدکننده: "+r.judge_count,"muted"));
  const totals=el("div",undefined,"grid");
  [["فنی",r.technical_total],["تشویقی",r.bonus_total],["جریمه",r.penalty_total],["نهایی",r.final_total]].forEach(([label,value])=>{
   const m=el("div",undefined,"metric");m.append(el("span",label),el("strong",Number(value||0).toFixed(2)));totals.append(m);
  });
  card.append(totals);
  const title=el("h4","جزئیات معیارها");card.append(title);
  (r.criteria||[]).forEach(c=>{
   const row=el("div",undefined,"criteria");row.append(el("span",c.criterion_name),el("strong",Number(c.average_points||0).toFixed(2)));card.append(row);
  });
  box.append(card);
 });
}
async function loadResults(){
 const tid=$("tournamentSelect").value;if(!tid){$("results").classList.add("hidden");return}
 status("در حال دریافت نتایج تأییدشده...");
 try{const rows=await rpc("get_public_judge_game_results",{p_tournament_id:tid});renderResults(rows||[]);$("results").classList.remove("hidden");status((rows||[]).length+" نتیجه تأییدشده دریافت شد.")}
 catch(e){$("results").classList.add("hidden");status("دریافت نتایج ناموفق بود: "+e.message,true)}
}
$("tournamentSelect").addEventListener("change",loadResults);
loadTournaments();
</script></body></html>
